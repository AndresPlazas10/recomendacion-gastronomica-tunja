name: Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/supabase.yml"]

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Iniciar Supabase local
        run: supabase start
      - name: Aplicar migraciones y seed
        run: supabase db reset
      - name: Lint de base de datos
        run: supabase db lint --level warning
